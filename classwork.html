<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classwork</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #bd9d72;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .name {
            font-size: 24px;
            font-weight: bold;
        }
        .links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .links a:hover {
            text-decoration: underline;
        }
        .box1 {
            width: 200px;
            height: 100px;

            background-color: #d2b48c;
            color: #3e2723;

            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;

            position: fixed;
            left: 20%;
            top: 10%;
            transform: translateX(-50%);
            box-shadow: 20px 20px 40px rgba(87, 86, 86, 0.719);
        }
        .box2 {
            width: 200px;
            height: 100px;

            background-color: #d2b48c;
            color: #3e2723;

            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;

            position: fixed;
            left: 20%;
            top: 10%;
            transform: translateX(-50%);
            box-shadow: 20px 20px 40px rgba(87, 86, 86, 0.719);
        }
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            .name {
                font-size: 20px;
            }
            .links {
                gap: 12px;
            }
            .links a {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="name">Name</div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
    <div class="box1">
        Box 1
    </div>
</body>
</html>
