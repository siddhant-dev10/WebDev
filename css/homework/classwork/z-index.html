<!DOCTYPE html>
<html>
<head>
  <title>Z-Index Example</title>
  <style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>This is a Heading for learing z-index</h1>
<img src="backgrounds.png">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
