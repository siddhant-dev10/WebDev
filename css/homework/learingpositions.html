<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-image: url("backgrounds.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .divs {
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name1 {
            position: absolute;
            top: 10px;
            left: 10px;
        }

        #name2 {
            position: absolute;
            top: 10px;
            left: 45%;
        }

        #name3 {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        #name4 {
            position: absolute;
            top: 50%;
            left: 10px;
        }

        #name5 {
            position: absolute;
            top: 50%;
            left: 45%;
        }

        #name6 {
            position: absolute;
            top: 50%;
            right: 10px;
        }

        #name7 {
            position: absolute;
            bottom: 10px;
            left: 10px;
        }

        #name8 {
            position: absolute;
            bottom: 10px;
            left: 45%;
        }

        #name9 {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>

<body>
    <div class="divs">
        <div id="name1">Siddhant</div>
        <div id="name2">Siddhant</div>
        <div id="name3">Siddhant</div>
        <div id="name4">Siddhant</div>
        <div id="name5">Siddhant</div>
        <div id="name6">Siddhant</div>
        <div id="name7">Siddhant</div>
        <div id="name8">Siddhant</div>
        <div id="name9">Siddhant</div>
    </div>
</body>

</html>
